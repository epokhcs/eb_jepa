# MPPI Planning for ATARI Breakout (discrete actions)
logging:
  tqdm_silent: false

task_specification:
  goal_source: random_state  # random_state or dset
  obs: rgb

planner:
  planner_name: mppi
  action_type: discrete  # IMPORTANT: discrete actions for ATARI
  num_actions: 4  # NOOP, FIRE, RIGHT, LEFT
  num_act_stepped: 1
  plan_length: 16  # Horizon (based on visualization showing good predictions up to 16 steps)
  n_iters: 10  # Planning iterations
  num_samples: 100  # Number of action sequences to sample
  temperature: 1.0  # Sampling temperature
  var_scale: 1.0
  decode_each_iteration: false

  planning_objective:
    objective_type: reward  # For ATARI, maximize reward
    sum_all_diffs: true
    alpha: 0.0

ctxt_window_time: 1
